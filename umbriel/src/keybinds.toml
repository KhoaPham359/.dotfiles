# Keybinds (see docs/user/keybinds.md) --------------------------------------

[keybinds]
# Runtime switchers can use `window-focus-warp:<id>` to move both focus and the
# cursor. Window ids come from `umbriel windows`, so they are not static binds.
"Mod+Return" = { action = "spawn:kitty", repeat = false }
"Mod+W" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+P" = "window-toggle-pinned"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+Q" = "window-close"

"Mod+B" = { action = "spawn:brave", repeat = false }
"Mod+E" = { action = "spawn:thunar", repeat = false }
"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Mod+I" = "spawn:noctalia msg settings-toggle"
"Mod+Shift+I" = "spawn:neovide .config/umbriel"

"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"
# Scratchpads return to their original output and position after temporary output loss.
# Add `:DP-1` to any scratchpad action to target that output from anywhere.
# "Mod+0" = "scratchpad-toggle:DP-1"
# "Mod+Shift+0" = "window-move-to-scratchpad:DP-1"
# "Mod+Ctrl+0" = "window-restore-from-scratchpad:DP-1"
# "Mod+Alt+0" = "scratchpad-focus-next:DP-1"
"Mod+Shift+F23" = "spawn:noctalia msg panel-toggle launcher"
"Mod+grave" = "overview-toggle"
# Directional focus binds also navigate the overview: left/right select cards,
# while up/down select workspace rows. The defWheelUpault Mod+H/J/K/L binds need no
# separate overview mapping.
# "Mod+Space" is taken above; pick a free chord for layout switching.
# "Mod+Shift+K" = "keyboard-layout-next"
# Drag a scrolling workspace directly along its configured axis.
# "Mod+MouseMiddle" = "layout-scroll-drag"
# Submaps can nest; entry binds should not repeat. Inspect the active layer with `umbriel submap`, or follow changes
# with `umbriel subscribe submap`.
# "Mod+R" = { action = "submap:resize", repeat = false }
# Omit `submap` to add no post-action transition, or set it to "reset" to exit after the action.
# "submap[resize],1" = { action = "window-set-width:0.5", submap = "reset" }
# "submap[resize],Escape" = "submap:reset"

# Output, workspace, and window movement actions.
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+H" = "window-focus-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+L" = "window-focus-right"
"Mod+WheelUp" = "window-focus-or-workspace-up"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+WheelDown" = "window-focus-or-workspace-down"
"Mod+J" = "window-focus-or-workspace-down"
