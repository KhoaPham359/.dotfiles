# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = true           # false lets newly started apps draw their own decorations
border_width = 2               # 0-100
outer_border_width = 0         # 0-100
corner_radius = 10             # 0-100, radius of the final decorated outer edge
drag_opacity = 0.75
# border_focused = "#7AA3FFFF"
# border_unfocused = "#292933FF"
# scratchpad_border_focused = "#E5C07BFF"
# scratchpad_border_unfocused = "#5C4A2AFF"
# outer_border_color = "#1A1A1FFF"
# insert_hint_color = "#7FC8FF80"
# backdrop_color = "#000000FF"

[appearance.blur]
enabled = true
optimized = true
passes = 3                     # 0-8
radius = 3                     # 0-100
noise = 0.02                   # 0.0-1.0
brightness = 0.9               # 0.0-2.0
contrast = 0.9                 # 0.0-2.0
saturation = 1.1               # 0.0-2.0

[appearance.shadow]
enabled = false
softness = 10                  # 0-200, 0 = hard edge
offset_x = 2                   # -200 to 200
offset_y = 2
color = "#0000007F"

# Animation ------------------------------------------------------------------

[animation]
enabled = true
duration_ms = 250              # 1-10000
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 150
curve = "easeout"
style = "popin"                # popin, zoom, slide, fade, none
scale = 0.85                   # 0.1-1.0, used by popin

[animation.windows_out]
enabled = true
duration_ms = 150
curve = "easeout"
style = "fade"                 # fade, slide

[animation.windows_move]
enabled = true                     # window move, resize, and floating maximize transitions
duration_ms = 250
curve = "easeout"

[animation.workspaces]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5                      # 0.0-1.0
blur = false
scale = 0.0                    # 0 preserves the window geometry
maximize = false
fullscreen = false

[animation.border]
enabled = false
duration_ms = 250
curve = "easeout"

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.0                      # 0.0-1.0

[animation.layers]
enabled = false
duration_ms = 250
curve = "easeout"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"             # "scrolling", "dwindle", or "master"
# Inspect every workspace's effective mode with `umbriel workspaces --json`.
gap = 8                        # 0-500
width_presets = [0.5, 0.667, 0.1] # width and height cycling, tiled and floating alike

[layout.struts]
# Signed logical pixels around normal tiled layouts, applied after panels.
# Negative values expand the tiled area beyond those bounds.
left = 0                       # -65535 to 65535
right = 0
top = 0
bottom = 0

[layout.scrolling]
# Vertical workspaces stack horizontal lanes from top to bottom.
# direction = "horizontal"
default_width_fraction = 0.5  # remove to let clients choose their initial width
# A matching output may override this initial-only value for all its workspaces.
center_underfull_strip = true  # center the strip whenever it is narrower than the viewport
center_focused = false # always center the focused column
expand_single_column = true # fill lone column to viewport width


[layout.dwindle]
# Keep each split direction fixed after it is created.
# preserve_split = false
[layout.master]
position = "left"              # "left" or "right"
default_width_fraction = 0.55  # 0.1-0.9
new_on_top = true             # place new windows at the top of the stack

